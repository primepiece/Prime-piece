<!doctype html>
<!-- Christmas giveaway post, warm "window light" version · IG 4:5 1080×1350.
     The light, shadows and plaster are drawn in CSS; the voucher is the supplied artwork and the
     stone is a crop of the real Teal Tide platter photo. Entry steps and terms go in the caption. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html,body,.page{width:1080px;height:1350px}
.page{background:linear-gradient(160deg,#F1E7DA 0%,#E8DACA 52%,#DCCAB6 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 12% 8%,rgba(255,244,224,.85),rgba(255,244,224,0) 70%)}
/* Window light falling across the wall: a soft bright patch with a blurred mullion cross. */
.window{position:absolute;left:330px;top:-260px;width:980px;height:1100px;transform:rotate(-24deg);filter:blur(24px);opacity:.72}
.window .pane{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,247,232,.9),rgba(255,247,232,.35))}
.window .bar{position:absolute;background:rgba(120,92,62,.55)}
.window .v{left:470px;top:0;width:46px;height:100%}
.window .h{left:0;top:520px;width:100%;height:42px}
.window .edge{position:absolute;left:-90px;top:0;width:90px;height:100%;background:rgba(120,92,62,.35)}
.grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.eye{position:absolute;left:84px;top:96px;font-size:22px;color:var(--ink-soft)}
.h1{position:absolute;left:84px;top:150px;font-size:118px;color:var(--charcoal)}
.sub{position:absolute;left:88px;top:420px;font-family:"Cormorant Garamond",serif;font-weight:300;font-style:italic;font-size:48px;color:var(--ink-soft)}
/* The voucher lying on the surface: a tight contact shadow plus a long soft shadow away from the light. */
.card{position:absolute;left:96px;top:548px;width:880px;height:528px;transform:rotate(-3deg)}
.card img{display:block;width:100%;height:100%;outline:1px solid rgba(44,42,38,.12)}
.card{box-shadow:2px 3px 4px rgba(60,40,20,.25),26px 38px 50px -6px rgba(70,48,26,.38),60px 80px 90px -20px rgba(70,48,26,.22)}
.stonewrap{position:absolute;right:-120px;bottom:-130px;width:640px;height:420px;transform:rotate(-9deg)}
.stone{width:100%;height:100%;border-radius:46px 0 0 0;background:url("../assets/photos/stone-teal-tide-texture.jpg") center/cover;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.06),-6px -3px 0 #8FB3AE,-22px -14px 34px rgba(70,48,26,.32),-4px -2px 6px rgba(70,48,26,.22)}
.foot{position:absolute;left:84px;bottom:84px;font-size:25px;line-height:1.7;color:var(--ink-soft)}
.foot b{font-weight:500;color:var(--charcoal)}
</style></head><body><div class="page">
<div class="glow"></div>
<div class="window"><div class="pane"></div><div class="edge"></div><div class="bar v"></div><div class="bar h"></div></div>
<div class="grain"></div>
<div class="eyebrow eye">Christmas giveaway</div>
<div class="h h1">Win a <em>$200</em><br>gift voucher.</div>
<div class="sub">Yours to keep, or to give for Christmas.</div>
<div class="stonewrap"><div class="stone"></div></div>
<div class="card"><img src="../assets/voucher-200.webp" alt="$200 Prime Piece gift voucher"></div>
<div class="foot"><b>How to enter: see caption ↓</b><br>Closes Sunday 22 November</div>
</div></body></html>
