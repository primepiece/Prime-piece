<!doctype html>
<!-- Launch teaser story, Wed 4 Nov · IG Story 1080×1920. Three voucher stones, no prices.
     Leave the gap under the stones for Instagram's countdown sticker (Thu 5 Nov). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html,body,.page{width:1080px;height:1920px}
.page{background:var(--charcoal);color:var(--ivory)}
.eye{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:22px;color:var(--sage-soft)}
.h1{position:absolute;left:0;right:0;top:360px;text-align:center;font-size:120px}
.h1 em{color:var(--sage-soft)}
.stones{position:absolute;left:84px;top:690px;display:flex;gap:24px}
.stones div{width:288px;height:442px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
.stones img{display:block;width:100%;height:100%;object-fit:cover}
.stones div:nth-child(2){transform:translateY(-28px)}
.hint{position:absolute;left:0;right:0;top:1560px;text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:46px;color:rgba(245,241,234,.85)}
</style></head><body><div class="page">
<div class="eyebrow eye">Prime Piece</div>
<div class="h h1">Something new.<br><em>Tomorrow.</em></div>
<div class="stones">
  <div><img src="../assets/photos/stone-panel-100.jpg" alt="White Haven marble"></div>
  <div><img src="../assets/photos/stone-panel-200.jpg" alt="Teal Tide marble"></div>
  <div><img src="../assets/photos/stone-panel-500.jpg" alt="Emerald Vein marble"></div>
</div>
<div class="hint">For the one who's impossible to buy for.</div>
</div></body></html>
