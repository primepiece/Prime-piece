<!doctype html>
<!-- 11 · IG Story 1080×1920 · poll background. Add Instagram's poll sticker in the gap (y ~1000–1180): "Blue" / "Burgundy". -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html,body,.page{width:1080px;height:1920px}
.page{background:var(--ivory)}
.h{left:0;top:260px;width:1080px;text-align:center;font-size:96px}
.sub{left:0;top:470px;width:1080px;text-align:center;font-size:30px;color:var(--ink-soft)}
.ph{position:absolute;top:560px;width:470px;height:420px;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.p1{left:60px}.p2{left:550px}
.lab{position:absolute;top:1000px;width:470px;text-align:center;font-family:"Cormorant Garamond",serif;font-weight:300;font-size:44px}
.l1{left:60px}.l2{left:550px}
.note{left:0;top:1440px;width:1080px;text-align:center;font-size:30px;color:var(--ink-soft);line-height:1.5}
.note .script{font-size:40px}
</style></head><body><div class="page">
<div class="abs h">Which stone would<br>you pick?</div>
<div class="abs sub">Same table, two one-of-one tops.</div>
<div class="ph p1"><img src="../assets/photos/table-20.jpg" alt="Side table with a blue stone top"></div>
<div class="ph p2"><img src="../assets/photos/table-23.jpg" alt="Side table with a burgundy stone top"></div>
<div class="lab l1">Blue</div><div class="lab l2">Burgundy</div>
<div class="abs note">Can't decide for someone else?<br>Let them choose. <span class="script">One of one.</span></div>
</div></body></html>
