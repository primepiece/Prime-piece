<!doctype html>
<!-- Envelope band for a C6 envelope (162 x 114 mm): 345 x 40 mm trim + 3 mm bleed. It wraps around
     the envelope (2 x 162 mm + a little for thickness + a 15 mm overlap glued at the back), so the
     text is centred on the front face. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
@page{size:351mm 46mm;margin:0}
html,body{width:351mm;height:46mm;overflow:hidden}
.page{position:relative;width:351mm;height:46mm;background:#2C2A26}
.t{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:3.2mm;padding-top:0.6mm}
.a{font-family:"Cormorant Garamond";font-weight:300;font-size:19pt;color:#F5F1EA;letter-spacing:0.01em}
.b{font-family:"Dancing Script";font-weight:500;font-size:21pt;color:#A8C3C5;margin-top:-0.8mm}
</style></head><body><div class="page"><div class="t"><span class="a">A gift,</span><span class="b">one of one</span></div></div></body></html>
