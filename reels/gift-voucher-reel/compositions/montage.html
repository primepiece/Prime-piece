  <script>
    // Motion follows each shot's data-start / data-duration, so retiming a cut in the HTML retimes its move.
    const tl = gsap.timeline({ paused: true });
    document.querySelectorAll(".m-shot").forEach((shot) => {
      const start = parseFloat(shot.dataset.start);
      const dur = parseFloat(shot.dataset.duration);
      const img = shot.querySelector("img");
      if (shot.dataset.push === "in") {
        tl.fromTo(img, { scale: 1 }, { scale: 1.07, duration: dur, ease: "sine.inOut" }, start);
      } else if (shot.dataset.push === "out") {
        tl.fromTo(img, { scale: 1.05 }, { scale: 1, duration: dur, ease: "power2.out" }, start);
      } else {
        tl.fromTo(img, { scale: 1.02 }, { scale: 1.02, duration: dur }, start);
      }
    });
    window.__timelines["montage"] = tl;
  </script>
