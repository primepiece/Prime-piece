  <script>
    // Motion follows each shot's data-start / data-duration, so retiming a cut retimes its move.
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#m-shot-board img", { scale: 1.0 }, { scale: 1.08, duration: 0.8, ease: "sine.inOut" }, 0);
    // The table and every swap share one continuous push-in, so the stone changes while the camera keeps moving.
    const Z0 = 1.0, Z1 = 1.1, A = 0.8, B = 3.1;
    const z = (t) => Z0 + (Z1 - Z0) * (t - A) / (B - A);
    document.querySelectorAll("#m-shot-table, .m-swap").forEach((shot) => {
      const start = parseFloat(shot.dataset.start);
      const dur = parseFloat(shot.dataset.duration);
      tl.fromTo(shot.querySelector("img"), { scale: z(start) }, { scale: z(start + dur), duration: dur, ease: "none" }, start);
    });
    window.__timelines["montage"] = tl;
  </script>
