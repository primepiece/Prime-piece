    }
    #root {
      position: absolute;

    .c-group {
      position: absolute;

    }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <!-- Phrase timings are placeholders: set each group's data-start/data-duration to the real recording. -->
    <div id="c-1" class="clip c-group" data-start="0.2" data-duration="1.35" data-track-index="0"><span class="c-pill">She’d love Prime Piece…</span></div>

    <div id="c-3" class="clip c-group" data-start="3.05" data-duration="1.1" data-track-index="0"><span class="c-pill">A marble board?</span></div>

  <script>
    // Each pill eases in at its group's start and out just before its end; the clip window does the hard kill.
    const tl = gsap.timeline({ paused: true });
    document.querySelectorAll(".c-group").forEach((group) => {
      const start = parseFloat(group.dataset.start);
      const end = start + parseFloat(group.dataset.duration);
      const pill = group.querySelector(".c-pill");
      tl.fromTo(pill, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, start);
      tl.to(pill, { opacity: 0, duration: 0.1, ease: "power2.in" }, end - 0.12);
    });
    window.__timelines["captions"] = tl;
  </script>
