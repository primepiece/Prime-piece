<template>
  <style>
    @font-face {
      font-family: "Inter Tight";
      font-weight: 500;
      src: url("assets/fonts/inter-tight-latin-500-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Cormorant Garamond";
      font-weight: 400;
      font-style: normal;
      src: url("assets/fonts/cormorant-garamond-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Cormorant Garamond";
      font-weight: 400;
      font-style: italic;
      src: url("assets/fonts/cormorant-garamond-latin-400-italic.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* Caption band: centred on y 1188, where Runway's captions sat (the talent punch-ins scale about this line),
       clear of the face and of Instagram's UI below 1330px. */
    .c-group {
      position: absolute;
      left: 0;
      top: 1133px;
      width: 1080px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    .c-pill {
      display: inline-block;
      padding: 20px 38px 22px;
      border-radius: 999px;
      background: rgba(28, 26, 23, 0.84);
      color: #f5f1ea;
      font-family: "Inter Tight", sans-serif;
      font-weight: 500;
      font-size: 54px;
      line-height: 1.1;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    /* Hook line over the opening shot, just under Instagram's top bar, set in ink over the bright window
       (where Runway's own hook line was removed). A soft cream halo keeps it clean where it meets her hair. */
    .c-hook {
      top: 168px;
      height: 160px;
    }
    .c-hook-text {
      display: inline-block;
      color: #2c2a26;
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: 76px;
      line-height: 1.02;
      letter-spacing: -0.005em;
      text-align: center;
      text-shadow:
        0 0 22px rgba(245, 241, 234, 0.85),
        0 0 6px rgba(245, 241, 234, 0.6);
    }
    .c-hook-text em {
      font-style: italic;
    }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <!--
      c-hook, c-1 and c-5 sit over the presenter shots and cover where Runway's burned-in text was removed, so
      they cut in and out with their shot (data-cut) instead of fading. The hook is on screen from frame 0.
    -->
    <div id="c-hook" class="clip c-group c-hook" data-start="0" data-duration="1.5" data-track-index="0" data-cut>
      <span class="c-hook-text">For the one with<br /><em>very</em> specific taste.</span>
    </div>
    <div id="c-1" class="clip c-group" data-start="0" data-duration="1.5" data-track-index="0" data-cut data-drift="54"><span class="c-pill">She’s impossible to buy for.</span></div>
    <div id="c-2" class="clip c-group" data-start="1.55" data-duration="0.72" data-track-index="0"><span class="c-pill">The marble board?</span></div>
    <div id="c-3" class="clip c-group" data-start="2.32" data-duration="0.9" data-track-index="0"><span class="c-pill">The table?</span></div>
    <div id="c-4" class="clip c-group" data-start="3.35" data-duration="1.22" data-track-index="0"><span class="c-pill">Which colour?</span></div>
    <div id="c-5" class="clip c-group" data-start="4.6" data-duration="1.25" data-track-index="0" data-cut><span class="c-pill">I’ll let her choose.</span></div>
  </div>
  <script>
    // Each line eases in at its group's start and out just before its end; the clip window does the hard kill.
    // Groups marked data-cut are on the presenter shots and simply cut with the shot.
    const tl = gsap.timeline({ paused: true });
    document.querySelectorAll(".c-group").forEach((group) => {
      if (group.hasAttribute("data-cut")) {
        // data-drift: follow the shot's punch-in (px moved by the caption band over the group's duration).
        if (group.dataset.drift) {
          tl.fromTo(group.firstElementChild, { y: 0 }, { y: parseFloat(group.dataset.drift), duration: parseFloat(group.dataset.duration), ease: "none" }, parseFloat(group.dataset.start));
        }
        return;
      }
      const start = parseFloat(group.dataset.start);
      const end = start + parseFloat(group.dataset.duration);
      const line = group.firstElementChild;
      tl.fromTo(line, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, start);
      tl.to(line, { opacity: 0, duration: 0.1, ease: "power2.in" }, end - 0.12);
    });
    window.__timelines["captions"] = tl;
  </script>
</template>
