  <script>
    const tl = gsap.timeline({ paused: true });
    // One continuous push-in across every swap, so the stone changes while the camera keeps moving.
    const Z0 = 1.0, Z1 = 1.1, B = 3.3;
    const z = (t) => Z0 + (Z1 - Z0) * t / B;
    document.querySelectorAll(".s-shot").forEach((shot) => {
      const start = parseFloat(shot.dataset.start);
      const dur = parseFloat(shot.dataset.duration);
      tl.fromTo(shot.querySelector("img"), { scale: z(start) }, { scale: z(start + dur), duration: dur, ease: "none" }, start);
    });
    // Hook 1 is on screen from frame 0 (it's the thumbnail); hook 2 pops in on its cut.
    tl.fromTo("#s-hook-1 .s-pill", { opacity: 1 }, { opacity: 1, duration: 1.45 }, 0);
    tl.to("#s-hook-1 .s-pill", { opacity: 0, duration: 0.1 }, 1.48);
    tl.fromTo("#s-hook-2 .s-pill", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 1.6);
    tl.to("#s-hook-2 .s-pill", { opacity: 0, duration: 0.1 }, 3.18);
    window.__timelines["swap-open"] = tl;
  </script>
