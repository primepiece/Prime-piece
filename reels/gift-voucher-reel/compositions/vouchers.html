    ]'
  >
    <div id="v-scene" class="clip" data-start="0" data-duration="8.1" data-track-index="0">
      <div class="v-bg"></div>
      <div id="v-rule" class="v-rule"></div>

      <div id="v-card-100" class="v-card"><img src="assets/vouchers/voucher-100.webp" alt="Prime Piece $100 gift voucher" /></div>
      <div id="v-card-200" class="v-card"><img src="assets/vouchers/voucher-200.webp" alt="Prime Piece $200 gift voucher" /></div>

      <!-- Headline block: 8.45 – 11.2 in the film -->
      <div id="v-copy-head" class="clip v-copy" data-start="2.6" data-duration="2.75" data-track-index="1">
        <div id="v-head" class="v-text v-head">
          <span class="v-mask"><span id="v-head-1" class="v-line" data-var-text="headline1">Their taste.</span></span>
          <span class="v-mask"><span id="v-head-2" class="v-line" data-var-text="headline2">Their choice.</span></span>
        </div>
        <div id="v-kicker" class="v-text v-kicker" data-var-text="kicker">Prime Piece digital gift vouchers</div>
        <div id="v-prices" class="v-text v-prices" data-var-text="prices">$100 / $200 / $500 NZD</div>

  </div>
  <script>
    // Scene clock starts at 5.85 s in the film. Card landings sit on the 100 BPM grid (0.6 s): 6.15, 6.75, 7.35, fan 7.95.
    const T = {
      rule: 0.0,
      card100: 0.3,
      card200: 0.9,
      card500: 1.5,
      fan: 2.1,
      head: 2.7,
      kicker: 3.4,
      prices: 3.6,
      delivery: 3.75,
      close: 5.1,
      closeLine: 5.3,
      cta: 5.65,
      url: 5.85,
      delivery2: 6.0,
      end: 8.1,
    };
    // Fan: $500 left (on top), $200 centre, $100 right. Each card's overlap covers only the marble strip of
    // the card to its right, so every value and logo stays visible.
    const FAN_SCALE = 0.4667; // 420 px wide
    const FAN = {
      "#v-card-500": { x: -262, y: -42, rotation: -6 },
      "#v-card-200": { x: 0, y: -70, rotation: 0 },
      "#v-card-100": { x: 262, y: -42, rotation: 6 },
    };
    const tl = gsap.timeline({ paused: true });

    // Breath before the reveal: a single sage hairline, as on the voucher.
    tl.fromTo("#v-rule", { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.24, ease: "power2.out" }, T.rule);
    tl.to("#v-rule", { opacity: 0, duration: 0.08 }, T.card100 - 0.04);

    // Each card drops onto the stack on its beat.
    const land = (sel, t, rot) => {
      tl.fromTo(
        sel,
        { opacity: 0, scale: 1.16, y: -40, rotation: rot * 2 },
        { opacity: 1, scale: 1, y: 0, rotation: rot, duration: 0.22, ease: "power3.out" },
        t,
      );
    };
    land("#v-card-100", T.card100, -2);
    land("#v-card-200", T.card200, 2);
    land("#v-card-500", T.card500, 0);
    // The cards underneath give a little as each one lands.
    tl.to("#v-card-100", { scale: 0.975, duration: 0.18, ease: "power2.out" }, T.card200 + 0.04);
    tl.to("#v-card-100", { scale: 0.955, duration: 0.18, ease: "power2.out" }, T.card500 + 0.04);
    tl.to("#v-card-200", { scale: 0.975, duration: 0.18, ease: "power2.out" }, T.card500 + 0.04);

    // Spread into the fan.
    Object.entries(FAN).forEach(([sel, p]) => {
      tl.to(sel, { x: p.x, y: p.y, rotation: p.rotation, scale: FAN_SCALE, duration: 0.6, ease: "power3.inOut" }, T.fan);
    });

    // Headline and product line.
    tl.fromTo("#v-head-1", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, T.head);
    tl.fromTo("#v-head-2", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, T.head + 0.22);
    tl.fromTo("#v-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, T.kicker);
    tl.fromTo("#v-prices", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, T.prices);
    tl.fromTo("#v-delivery-1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, T.delivery);

    // Close: headline steps aside, fan lifts, call to action arrives.
    tl.to(["#v-head", "#v-kicker", "#v-prices", "#v-delivery-1"], { opacity: 0, y: -18, duration: 0.25, ease: "power2.in" }, T.close);
    Object.entries(FAN).forEach(([sel, p]) => {
      tl.to(sel, { y: p.y - 50, scale: FAN_SCALE * 0.96, duration: 0.6, ease: "power3.inOut" }, T.close);
    });
    tl.fromTo("#v-close-1", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, T.closeLine);
    tl.fromTo("#v-close-2", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, T.closeLine + 0.2);
    tl.fromTo("#v-cta", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, T.cta);
    tl.fromTo("#v-url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, T.url);
    tl.fromTo("#v-delivery-2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, T.delivery2);
    // Gentle drift on the hold so the end card never freezes.
    Object.entries(FAN).forEach(([sel, p]) => {
      tl.to(sel, { y: p.y - 62, duration: T.end - (T.close + 0.6), ease: "none" }, T.close + 0.6);
    });
    window.__timelines["vouchers"] = tl;
  </script>
