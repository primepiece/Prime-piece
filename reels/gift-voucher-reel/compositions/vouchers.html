    data-composition-variables='[

  >
    <div id="v-scene" class="clip" data-start="0" data-duration="4.35" data-track-index="0">

      <div id="v-card-100" class="v-card"><img src="assets/vouchers/voucher-100.webp" alt="Prime Piece $100 gift voucher" /></div>

  <script>
    // Scene clock starts at 5.85 s in the film, straight after "I'll let her choose." The cards slam in on the cut.
    const T = {
      card100: 0.0,
      card200: 0.22,
      card500: 0.44,
      fan: 0.8,
      pick: 1.2,
      head: 1.25,
      prices: 1.75,
      delivery: 1.9,
      cta: 2.15,
      url: 2.2,
      end: 4.35,
    };
    // Fan: $500 left (on top), $200 centre, $100 right. Each overlap covers only the marble strip of the
    // card to its right, so every value and logo stays readable.
    const FAN_SCALE = 0.5; // 450 px wide
    const FAN = {
      "#v-card-500": { x: -268, y: -170, rotation: -6 },
      "#v-card-200": { x: 0, y: -196, rotation: 0 },
      "#v-card-100": { x: 268, y: -170, rotation: 6 },
    };
    const tl = gsap.timeline({ paused: true });

    // Each card slams onto the stack, full width.
    const land = (sel, t, rot) => {
      tl.fromTo(
        sel,
        { opacity: 0, scale: 1.22, y: -60, rotation: rot * 2.5 },
        { opacity: 1, scale: 1, y: 0, rotation: rot, duration: 0.18, ease: "power4.out" },
        t,
      );
    };
    land("#v-card-100", T.card100, -2);
    land("#v-card-200", T.card200, 2);
    land("#v-card-500", T.card500, 0);
    // The cards underneath give a little as each one lands.
    tl.to("#v-card-100", { scale: 0.975, duration: 0.14, ease: "power2.out" }, T.card200 + 0.03);
    tl.to("#v-card-100", { scale: 0.955, duration: 0.14, ease: "power2.out" }, T.card500 + 0.03);
    tl.to("#v-card-200", { scale: 0.975, duration: 0.14, ease: "power2.out" }, T.card500 + 0.03);

    // Spread into the fan.
    Object.entries(FAN).forEach(([sel, p]) => {
      tl.to(sel, { x: p.x, y: p.y, rotation: p.rotation, scale: FAN_SCALE, duration: 0.5, ease: "power3.inOut" }, T.fan);
    });
    // Flag the $200 as the pick (matches the badge on gift-vouchers.html).
    tl.fromTo("#v-pick", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T.pick);

    tl.fromTo("#v-head-1", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, T.head);
    tl.fromTo("#v-head-2", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, T.head + 0.18);
    tl.fromTo("#v-prices", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, T.prices);
    tl.fromTo("#v-delivery", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, T.delivery);
    tl.fromTo("#v-cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, T.cta);
    tl.fromTo("#v-url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, T.url);
    // A small pulse on the button, then a slow drift on the fan, so the end card never freezes.
    tl.to("#v-cta", { scale: 1.05, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, T.cta + 1.1);
    Object.entries(FAN).forEach(([sel, p]) => {
      tl.to(sel, { y: p.y - 14, duration: T.end - (T.fan + 0.5), ease: "none" }, T.fan + 0.5);
    });
    window.__timelines["vouchers"] = tl;
  </script>
