<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Prime Piece — Gift Voucher Reel</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --cream: #f5f1ea;
        --ink: #2c2a26;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ink);
      }
      .talent {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 1;
      }
      #montage {
        z-index: 2;
      }
      #vouchers {
        z-index: 3;
      }
      #captions {
        z-index: 10;
      }
      #wip-label {
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <!--
      TIMING MAP (seconds) — see README.md for how to retime to the real recording.
        0.0 – 3.0   VIDEO SLOT A  · opening line on camera   (#slot-a)
        3.0 – 7.8   product montage, recording plays as voice only (#montage + #vo-montage)
        7.8 – 9.9   VIDEO SLOT B  · solution line on camera  (#slot-b)
        9.9 – 10.2  breath / musical pause
        10.2 – 18.0 voucher reveal (cards land 10.2, 10.8, 11.4 · fan 12.0 · headline 12.6) and close (15.0)
      Beat grid for music: 100 BPM (0.6 s), downbeat on 10.2.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1920"
    >
      <!-- TALENT RECORDING: one continuous take, assets/footage/recording.mp4 (currently a labelled placeholder) -->
      <video
        id="slot-a"
        class="clip talent"
        src="assets/footage/recording.mp4"
        data-start="0"
        data-duration="3"
        data-media-start="0"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <audio
        id="vo-montage"
        src="assets/footage/recording.mp4"
        data-start="3"
        data-duration="4.8"
        data-media-start="3"
        data-volume="1"
        data-track-index="6"
      ></audio>
      <video
        id="slot-b"
        class="clip talent"
        src="assets/footage/recording.mp4"
        data-start="7.8"
        data-duration="2.1"
        data-media-start="7.8"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>

      <div
        id="montage"
        data-composition-id="montage"
        data-composition-src="compositions/montage.html"
        data-start="3"
        data-duration="4.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="vouchers"
        data-composition-id="vouchers"
        data-composition-src="compositions/vouchers.html"
        data-start="9.9"
        data-duration="8.1"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="9.9"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Work-in-progress tag: delete this host (or add data-hidden) for the final export -->
      <div
        id="wip-label"
        data-composition-id="wip-label"
        data-composition-src="compositions/wip-label.html"
        data-start="0"
        data-duration="18"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!--
        MUSIC SLOT (empty in this preview). Add a licensed instrumental at ~100 BPM, e.g.
          <audio id="music" src="assets/music/track.mp3" data-start="0" data-duration="9.6" data-volume="0.35" data-fade-out="0.08"></audio>
          <audio id="music-drop" src="assets/music/track.mp3" data-start="10.2" data-media-start="<a downbeat>" data-duration="7.8" data-volume="0.6" data-fade-out="1"></audio>
        9.6 – 10.2 is left silent on purpose: the pause before the reveal.
      -->

      <!-- SFX: each start sits one frame after its picture, offset by the file's measured onset -->
      <audio id="sfx-cut-montage" src="assets/sfx/whoosh.mp3" data-start="2.968" data-volume="0.3" data-duration="0.575" data-track-index="7"></audio>
      <audio id="sfx-cut-table" src="assets/sfx/whoosh.mp3" data-start="4.168" data-volume="0.2" data-duration="0.575" data-track-index="7"></audio>
      <audio id="sfx-tick-1" src="assets/sfx/click.mp3" data-start="5.388" data-volume="0.22" data-duration="0.366" data-track-index="8"></audio>
      <audio id="sfx-tick-2" src="assets/sfx/click.mp3" data-start="5.838" data-volume="0.18" data-duration="0.366" data-track-index="9"></audio>
      <audio id="sfx-tick-3" src="assets/sfx/click.mp3" data-start="6.288" data-volume="0.24" data-duration="0.366" data-track-index="10"></audio>
      <audio id="sfx-tick-4" src="assets/sfx/click.mp3" data-start="6.588" data-volume="0.2" data-duration="0.366" data-track-index="8"></audio>
      <audio id="sfx-tick-5" src="assets/sfx/click.mp3" data-start="6.888" data-volume="0.26" data-duration="0.366" data-track-index="9"></audio>
      <audio id="sfx-tick-6" src="assets/sfx/click.mp3" data-start="7.188" data-volume="0.22" data-duration="0.366" data-track-index="10"></audio>
      <audio id="sfx-tick-7" src="assets/sfx/click.mp3" data-start="7.338" data-volume="0.28" data-duration="0.366" data-track-index="8"></audio>
      <audio id="sfx-tick-8" src="assets/sfx/click.mp3" data-start="7.488" data-volume="0.24" data-duration="0.366" data-track-index="9"></audio>
      <audio id="sfx-tick-9" src="assets/sfx/click.mp3" data-start="7.638" data-volume="0.3" data-duration="0.366" data-track-index="10"></audio>
      <audio id="sfx-reveal-hit" src="assets/sfx/impact-bass-1.mp3" data-start="10.188" data-volume="0.5" data-duration="2.116" data-track-index="11"></audio>
      <audio id="sfx-card-200" src="assets/sfx/pop.mp3" data-start="10.723" data-volume="0.45" data-duration="0.72" data-track-index="12"></audio>
      <audio id="sfx-card-500" src="assets/sfx/pop.mp3" data-start="11.323" data-volume="0.55" data-duration="0.72" data-track-index="13"></audio>
      <audio id="sfx-fan" src="assets/sfx/whoosh.mp3" data-start="11.968" data-volume="0.25" data-duration="0.575" data-track-index="7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
