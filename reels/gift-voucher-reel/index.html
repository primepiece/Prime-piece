<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Prime Piece — Gift Voucher Reel</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --cream: #f5f1ea;
        --ink: #2c2a26;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ink);
      }
      .talent {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 1;
        transform-origin: 50% 15%;
      }
      #montage {
        z-index: 2;
      }
      #vouchers {
        z-index: 3;
      }
      #captions {
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <!--
      TIMING MAP (seconds) — v4. See README.md to swap in clean clips.
        0.0 – 1.5    VIDEO SLOT A · "She's impossible to buy for." (slow punch-in)   (#slot-a)
        1.5 – 4.6    full-screen montage; voice only: "The marble board? The table? Which colour?"
                     — on "Which colour?" the same side table changes stone on every cut (#montage + #vo-montage)
        4.6 – 5.85   VIDEO SLOT B · "I'll let her choose." (tighter framing)          (#slot-b)
        5.85 – 10.2  vouchers slam in (5.85, 6.07, 6.29) · fan 6.65 · Our pick + headline 7.05 · CTA 8.1
      Music is added in the Instagram app at upload (see README.md).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.2"
      data-width="1080"
      data-height="1920"
    >
      <!-- TALENT: stand-in is the Runway export (720p, captions burned in). Replace with the clean clips; see README.md -->
      <video
        id="slot-a"
        class="clip talent"
        src="assets/footage/runway-standin.mp4"
        data-start="0"
        data-duration="1.5"
        data-media-start="0"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <audio
        id="vo-montage"
        src="assets/footage/runway-standin.mp4"
        data-start="1.5"
        data-duration="2.5"
        data-media-start="1.5"
        data-volume="1"
        data-track-index="6"
      ></audio>
      <video
        id="slot-b"
        class="clip talent"
        src="assets/footage/runway-standin.mp4"
        data-start="4.6"
        data-duration="1.25"
        data-media-start="4.0"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>

      <div
        id="montage"
        data-composition-id="montage"
        data-composition-src="compositions/montage.html"
        data-start="1.5"
        data-duration="3.1"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="vouchers"
        data-composition-id="vouchers"
        data-composition-src="compositions/vouchers.html"
        data-start="5.85"
        data-duration="4.35"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="5.85"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- No music in the file: it's added in the Instagram app at upload. To bake a licensed track in instead,
           add <audio id="music" src="assets/music/track.mp3" data-start="0" data-duration="10.2" data-volume="0.35"></audio>
           with a strong downbeat on 5.85 (the voucher slam). -->

      <!-- SFX: each start sits one frame after its picture, offset by the file's measured onset -->
      <audio id="sfx-cut-montage" src="assets/sfx/whoosh.mp3" data-start="1.468" data-volume="0.3" data-duration="0.575" data-track-index="7"></audio>
      <audio id="sfx-cut-table" src="assets/sfx/whoosh.mp3" data-start="2.268" data-volume="0.2" data-duration="0.575" data-track-index="7"></audio>
      <!-- one tick per stone swap -->
      <audio id="sfx-tick-1" src="assets/sfx/click.mp3" data-start="3.238" data-volume="0.22" data-duration="0.3" data-track-index="8"></audio>
      <audio id="sfx-tick-2" src="assets/sfx/click.mp3" data-start="3.498" data-volume="0.2" data-duration="0.3" data-track-index="9"></audio>
      <audio id="sfx-tick-3" src="assets/sfx/click.mp3" data-start="3.718" data-volume="0.24" data-duration="0.3" data-track-index="10"></audio>
      <audio id="sfx-tick-4" src="assets/sfx/click.mp3" data-start="3.908" data-volume="0.22" data-duration="0.3" data-track-index="8"></audio>
      <audio id="sfx-tick-5" src="assets/sfx/click.mp3" data-start="4.078" data-volume="0.26" data-duration="0.3" data-track-index="9"></audio>
      <audio id="sfx-tick-6" src="assets/sfx/click.mp3" data-start="4.228" data-volume="0.24" data-duration="0.3" data-track-index="10"></audio>
      <audio id="sfx-tick-7" src="assets/sfx/click.mp3" data-start="4.358" data-volume="0.28" data-duration="0.3" data-track-index="8"></audio>
      <audio id="sfx-tick-8" src="assets/sfx/click.mp3" data-start="4.478" data-volume="0.3" data-duration="0.3" data-track-index="9"></audio>
      <audio id="sfx-reveal-hit" src="assets/sfx/impact-bass-1.mp3" data-start="5.838" data-volume="0.55" data-duration="2.116" data-track-index="11"></audio>
      <audio id="sfx-card-200" src="assets/sfx/pop.mp3" data-start="5.993" data-volume="0.45" data-duration="0.72" data-track-index="12"></audio>
      <audio id="sfx-card-500" src="assets/sfx/pop.mp3" data-start="6.213" data-volume="0.55" data-duration="0.72" data-track-index="13"></audio>
      <audio id="sfx-fan" src="assets/sfx/whoosh.mp3" data-start="6.618" data-volume="0.25" data-duration="0.575" data-track-index="7"></audio>
      <audio id="sfx-cta" src="assets/sfx/click.mp3" data-start="7.988" data-volume="0.25" data-duration="0.3" data-track-index="8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Slow punch-in on the opening line; the second line starts tighter, so it reads as a new shot.
      tl.fromTo("#slot-a", { scale: 1 }, { scale: 1.06, duration: 1.5, ease: "none" }, 0);
      tl.fromTo("#slot-b", { scale: 1.1 }, { scale: 1.14, duration: 1.25, ease: "none" }, 4.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
