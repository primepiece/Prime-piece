<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Prime Piece — The Christmas Release</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #16120f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #16120f;
      }
    </style>
  </head>
  <body>
    <!--
      PREVIEW CUT: 0 – 3 s only (the colour reveal), for checking framing and the cuts.
        0.0 red · 1.0 green · 2.0 white   "Three Christmas colours."
      Music: assets/music/christmas-release.wav (original, made in music/compose.py).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="reveal"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio
        id="music"
        src="assets/music/christmas-release.wav"
        data-start="0"
        data-duration="3"
        data-volume="1"
        data-fade-out="0.25"
        data-track-index="5"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
