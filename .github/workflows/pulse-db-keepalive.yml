name: Pulse database keep-alive

# Upstash deletes free Redis databases after 14 days with no commands. The Pulse
# database (scale-os/lib/store.js) is only touched when someone opens Pulse or the
# Market Radar worker runs, so it was deleted in October 2026 after a quiet spell.
# This sends one read-only DBSIZE command twice a week to keep it active. No
# Anthropic or Tavily calls, so it costs nothing. If the database is unreachable
# the run fails, and GitHub's failed-run email is the early warning.
#
# Kept separate from market-radar-scan.yml on purpose: a schedule trigger there
# runs RADAR_MODE=daily, which spends real API credit.
on:
  schedule:
    # Mondays and Thursdays 20:17 UTC (~9am NZ the next morning)
    - cron: "17 20 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the Pulse Redis database
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          if [ -z "$KV_REST_API_URL" ] || [ -z "$KV_REST_API_TOKEN" ]; then
            echo "KV_REST_API_URL / KV_REST_API_TOKEN repo secrets are not set." >&2
            exit 1
          fi
          body=$(curl -fsS --max-time 30 -H "Authorization: Bearer $KV_REST_API_TOKEN" "$KV_REST_API_URL/dbsize")
          echo "Database reachable: $body"
