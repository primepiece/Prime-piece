name: Market Radar scan

# Runs automatically every day (see `schedule` below) so Prime Piece Pulse gets
# smarter without anyone touching it, and stays available for manual runs via
# workflow_dispatch (diagnostics, one-off candidate research, or re-running 'daily'
# by hand). A scheduled run always uses RADAR_MODE=daily — `inputs.mode` is only
# populated for workflow_dispatch, so `inputs.mode || 'daily'` below falls through
# to 'daily' on a cron-triggered run.
on:
  schedule:
    # 15:00 UTC = ~3am NZST / ~4am NZDT — comfortably before any normal NZ workday
    # starts, with a wide buffer either side of the NZ daylight-saving switchover.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "list = zero-cost read-only dump of the real stored Market Radar data (no Anthropic call, no writes) — use this first to inspect production data for free. diag-basic/diag-search = cheap 1-call connectivity checks (run these first if things are failing). hunt = find new candidates only. refresh = re-research the stalest existing tier A/B opportunities only. daily = hunt + refresh + the Pulse synthesis brief, same as the nightly schedule. candidate = research/refresh one specific product. supplier = find suppliers + draft an outreach approval for one existing Market Radar opportunity (see supplier_target below). quote-capture = parse any supplier replies James has pasted into the Suppliers page and recalculate economics. demand-evidence = Tavily-only (no Anthropic web_search) targeted consumer-market evidence pass — automatically targets every opportunity that currently PASSES the Commercial Funnel's Prime Piece Fit gate, gathers real retailers/reviews/bestseller-signals/NZ-competitors, and merges them into existing competitors[]/trendSignals[] fields; never touches score/priceBand. None of supplier, quote-capture, or demand-evidence ever run automatically."
        required: true
        type: choice
        options: [list, diag-basic, diag-search, hunt, refresh, daily, candidate, supplier, quote-capture, demand-evidence]
        default: diag-basic
      candidate:
        description: 'Only used when mode=candidate. Format: "Product Name|Variant|Category" (variant/category optional).'
        required: false
        type: string
      supplier_target:
        description: 'Only used when mode=supplier. The Market Radar opportunity id to research suppliers for, e.g. "radar_003" (see the Market Radar page for ids).'
        required: false
        type: string
      hunt_count:
        description: "Used when mode=hunt or daily. New candidates to find and research (1-5, kept small on purpose — cost)."
        required: false
        type: string
        default: "3"
      refresh_count:
        description: "Used when mode=refresh or daily. Stalest existing tier A/B opportunities to re-research (1-5)."
        required: false
        type: string
        default: "3"
      search_budget:
        description: "Max web searches per Claude call (2-10). Higher = more thorough, more cost."
        required: false
        type: string
        default: "6"
      dry_run:
        description: "If true, skips real Anthropic API calls and uses fixture data — proves the merge/audit/rank/synthesis pipeline for free."
        required: true
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Without this, a stuck run falls back to GitHub's 360-minute default cap.
    # 90 min comfortably covers the worst case (every one of ~7 sequential Claude
    # calls exhausting all 3 retries at the 240s per-call timeout, ~85 min) while
    # guaranteeing a hang is auto-cancelled instead of running for hours unwatched.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # diag-basic / diag-search run scripts/market-radar/diag.mjs — a separate, much
      # smaller script with no retry logic, exactly one Anthropic call, and a short
      # timeout (30s / 90s). Use these first when something is failing: they isolate
      # "does a basic Messages API call succeed at all" and "does web_search succeed"
      # from the full multi-call, multi-search research pipeline in run.mjs.
      - name: Run Market Radar research worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Supplier discovery's Stage 1 (deterministic web retrieval) — only used by
          # mode=supplier, never by hunt/refresh/daily/candidate.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RADAR_MODE: ${{ inputs.mode || 'daily' }}
          RADAR_CANDIDATE: ${{ inputs.candidate }}
          RADAR_SUPPLIER_TARGET: ${{ inputs.supplier_target }}
          RADAR_HUNT_COUNT: ${{ inputs.hunt_count || '2' }}
          RADAR_REFRESH_COUNT: ${{ inputs.refresh_count || '3' }}
          RADAR_SEARCH_BUDGET: ${{ inputs.search_budget || '6' }}
          RADAR_DRY_RUN: ${{ inputs.dry_run }}
          DIAG_MODE: ${{ inputs.mode == 'diag-basic' && 'basic' || (inputs.mode == 'diag-search' && 'search' || '') }}
        run: |
          if [[ "${{ inputs.mode }}" == diag-* ]]; then
            node scripts/market-radar/diag.mjs
          else
            node scripts/market-radar/run.mjs
          fi
