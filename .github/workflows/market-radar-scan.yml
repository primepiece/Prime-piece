name: Market Radar scan

# The nightly `schedule` trigger is TEMPORARILY DISABLED (see the comment on `on:`
# below) — this workflow currently only runs when someone manually triggers it via
# workflow_dispatch. If/when the schedule is re-enabled, a cron-triggered run always
# uses RADAR_MODE=daily — `inputs.mode` is only populated for workflow_dispatch, so
# `inputs.mode || 'daily'` below falls through to 'daily' on a cron-triggered run.
on:
  # Scheduled nightly 'daily' run TEMPORARILY DISABLED as of the 2026-09-18 cost/
  # architecture audit — an unattended cron job spending real Anthropic credits every
  # night with no per-run review was one of the two biggest "unexpected spend" risks
  # found (the other was demand-evidence's uncapped fan-out, now capped below). Re-
  # enable by uncommenting the block below only once the Redis daily/monthly budget
  # guard (scale-os/lib/store.js getAnthropicSpend/recordAnthropicSpend, enforced in
  # scripts/market-radar/run.mjs) has been observed working correctly for a few real
  # manual runs.
  # schedule:
  #   # 15:00 UTC = ~3am NZST / ~4am NZDT — comfortably before any normal NZ workday
  #   # starts, with a wide buffer either side of the NZ daylight-saving switchover.
  #   - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "list = zero-cost read-only dump of the real stored Market Radar data (no Anthropic call, no writes) — use this first to inspect production data for free. diag-basic/diag-search = cheap 1-call connectivity checks (run these first if things are failing). hunt = find new candidates only. refresh = re-research the stalest existing tier A/B opportunities only. daily = hunt + refresh + the Pulse synthesis brief, same as the nightly schedule. candidate = research/refresh one specific product. supplier = find suppliers + draft an outreach approval for one existing Market Radar opportunity (see supplier_target below). quote-capture = parse any supplier replies James has pasted into the Suppliers page and recalculate economics. demand-evidence = Tavily-only (no Anthropic web_search) targeted consumer-market evidence pass — automatically targets every opportunity that currently PASSES the Commercial Funnel's Prime Piece Fit gate, gathers real retailers/reviews/bestseller-signals/NZ-competitors, and merges them into existing competitors[]/trendSignals[] fields; never touches score/priceBand. fast-track = processes every PENDING Fast Track Product Analysis request submitted from the Fast Track page (or the Market Radar 'Fast Track Analysis' button) — extraction, market validation, design intelligence, supplier search, economics, and risk for one pasted product URL at a time. None of supplier, quote-capture, demand-evidence, or fast-track ever run automatically."
        required: true
        type: choice
        options: [list, diag-basic, diag-search, hunt, refresh, daily, candidate, supplier, quote-capture, demand-evidence, fast-track]
        default: diag-basic
      candidate:
        description: 'Only used when mode=candidate. Format: "Product Name|Variant|Category" (variant/category optional).'
        required: false
        type: string
      supplier_target:
        description: 'Only used when mode=supplier. The Market Radar opportunity id to research suppliers for, e.g. "radar_003" (see the Market Radar page for ids).'
        required: false
        type: string
      fast_track_seed_product_url:
        description: 'Optional, mode=fast-track only. Seeds one ad-hoc Fast Track request (product URL) before processing every pending request — for a one-off run without using the Fast Track page form first. Leave blank to just process whatever is already pending.'
        required: false
        type: string
      fast_track_seed_supplier_url:
        description: "Optional, mode=fast-track only. Known/named supplier URL for the seeded request above."
        required: false
        type: string
      fast_track_seed_competitor_urls:
        description: "Optional, mode=fast-track only. Comma-separated competitor URLs for the seeded request above."
        required: false
        type: string
      fast_track_seed_notes:
        description: "Optional, mode=fast-track only. Founder notes for the seeded request above."
        required: false
        type: string
      hunt_count:
        description: "Used when mode=hunt or daily. New candidates to find and research (1-5, kept small on purpose — cost)."
        required: false
        type: string
        default: "3"
      refresh_count:
        description: "Used when mode=refresh or daily. Stalest existing tier A/B opportunities to re-research (1-5)."
        required: false
        type: string
        default: "3"
      search_budget:
        description: "Unused as of the 2026-09-18 cost audit — hunt/refresh/candidate/daily no longer use Anthropic's agentic web_search (converted to Tavily retrieval, like every other mode). Kept only so old saved run configs don't break; has no effect."
        required: false
        type: string
        default: "6"
      dry_run:
        description: "If true, skips real Anthropic API calls and uses fixture data — proves the merge/audit/rank/synthesis pipeline for free."
        required: true
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Without this, a stuck run falls back to GitHub's 360-minute default cap.
    # 90 min comfortably covers the worst case (every one of ~7 sequential Claude
    # calls exhausting all 3 retries at the 240s per-call timeout, ~85 min) while
    # guaranteeing a hang is auto-cancelled instead of running for hours unwatched.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # diag-basic / diag-search run scripts/market-radar/diag.mjs — a separate, much
      # smaller script with no retry logic, exactly one Anthropic call, and a short
      # timeout (30s / 90s). Use these first when something is failing: they isolate
      # "does a basic Messages API call succeed at all" and "does web_search succeed"
      # from the full multi-call, multi-search research pipeline in run.mjs.
      - name: Run Market Radar research worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # Supplier discovery's Stage 1 (deterministic web retrieval) — only used by
          # mode=supplier, never by hunt/refresh/daily/candidate.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RADAR_MODE: ${{ inputs.mode || 'daily' }}
          RADAR_CANDIDATE: ${{ inputs.candidate }}
          RADAR_SUPPLIER_TARGET: ${{ inputs.supplier_target }}
          FAST_TRACK_SEED_PRODUCT_URL: ${{ inputs.fast_track_seed_product_url }}
          FAST_TRACK_SEED_SUPPLIER_URL: ${{ inputs.fast_track_seed_supplier_url }}
          FAST_TRACK_SEED_COMPETITOR_URLS: ${{ inputs.fast_track_seed_competitor_urls }}
          FAST_TRACK_SEED_NOTES: ${{ inputs.fast_track_seed_notes }}
          RADAR_HUNT_COUNT: ${{ inputs.hunt_count || '2' }}
          RADAR_REFRESH_COUNT: ${{ inputs.refresh_count || '3' }}
          RADAR_SEARCH_BUDGET: ${{ inputs.search_budget || '6' }}
          RADAR_DRY_RUN: ${{ inputs.dry_run }}
          DIAG_MODE: ${{ inputs.mode == 'diag-basic' && 'basic' || (inputs.mode == 'diag-search' && 'search' || '') }}
          # --- Cost guardrails (2026-09-18 audit) — operational safety knobs, not a
          # research feature, so these are plain hardcoded env vars here rather than
          # workflow_dispatch inputs. Edit these values directly (and via a PR, like any
          # other code change) rather than exposing them on the dispatch form.
          # A single run.mjs process refuses to make more than this many real Anthropic
          # calls total, counting every retry — see run.mjs's assertBudgetAvailable/
          # MAX_ANTHROPIC_CALLS_PER_RUN. 30 comfortably covers the worst-case legitimate
          # 'daily' run (hunt + up to 5 refreshed + up to 5 newly-hunted enrichments,
          # each up to 2 attempts, plus 1 synthesis call = 23) with headroom, while still
          # being a real ceiling far below what an uncapped bug could run up.
          MAX_ANTHROPIC_CALLS_PER_RUN: "30"
          # Placeholder per-1K-token USD rates used only to ESTIMATE spend for the budget
          # guard below — set these to the account's actual contracted rate for an
          # accurate dollar figure; the guard itself (refusing further calls once the
          # estimate crosses the budget) works regardless of how accurate the rate is.
          ANTHROPIC_PRICE_PER_1K_INPUT_USD: "0.003"
          ANTHROPIC_PRICE_PER_1K_OUTPUT_USD: "0.015"
          # Hard refusal thresholds, checked before every real Anthropic call against a
          # running total kept in Redis (scale_os:anthropic_spend:v1) — once either is
          # reached, every mode except 'list' refuses to make another paid call until the
          # next UTC day/month. Tune to the account's real budget.
          ANTHROPIC_DAILY_BUDGET_USD: "5"
          ANTHROPIC_MONTHLY_BUDGET_USD: "50"
          # Caps the fan-out of demand-evidence (previously: every Fit-passing
          # opportunity, unbounded — 19 in one real run this week), fast-track
          # (previously: every PENDING request in one run, unbounded), and quote-capture
          # (previously: every pending supplier reply, unbounded) to this many targets
          # per run. Re-run to cover whatever's left over the cap.
          RADAR_MAX_TARGETS_PER_RUN: "5"
        run: |
          if [[ "${{ inputs.mode }}" == diag-* ]]; then
            node scripts/market-radar/diag.mjs
          else
            node scripts/market-radar/run.mjs
          fi
