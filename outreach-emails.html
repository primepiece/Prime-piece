function getPriorityClass(p) {
  if (p === 10) return 'p10';
  if (p === 9) return 'p9';
  if (p === 8) return 'p8';
  if (p === 7) return 'p7';
  if (p === 6) return 'p6';
  return 'p5';
}

function renderCards(filter) {
  const container = document.getElementById('cards');
  const filtered = filter === 'all' ? emails : emails.filter(e => e.cat === filter);
  container.innerHTML = filtered.map(e => `
    <div class="card" data-cat="${e.cat}">
      <div class="card-header">
        <div class="card-meta">
          <div class="card-num">${String(e.num).padStart(2,'0')}</div>
          <div>
            <div class="card-biz">${e.biz}</div>
            <div class="card-person">${e.person} &nbsp;·&nbsp; ${e.to}</div>
          </div>
        </div>
        <div class="card-badges">
          <div class="badge-cat">${e.cat}</div>
          <div class="badge-priority ${getPriorityClass(e.priority)}">Priority ${e.priority}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="email-block">
          <div class="email-label">
            First Message
            <button class="copy-btn" onclick="copyEmail(this, ${e.num}, 'first')">Copy</button>
          </div>
          <div class="email-inner">
            <div class="email-subject">Subject: <span>${e.subject}</span></div>
            <div class="email-to">To: <span>${e.to}</span></div>
            <div class="email-body" id="first-${e.num}">${e.body}</div>
          </div>
        </div>
        <div class="email-block">
          <div class="email-label" style="background:#3d3d3a;">
            Follow-Up (Day 7)
            <button class="copy-btn" onclick="copyEmail(this, ${e.num}, 'follow')">Copy</button>
          </div>
          <div class="email-inner">
            <div class="email-subject">Subject: <span>Re: ${e.subject}</span></div>
            <div class="email-to">To: <span>${e.to}</span></div>
            <div class="email-body" id="follow-${e.num}">${e.followup}</div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function copyEmail(btn, num, type) {
  const el = document.getElementById(`${type}-${num}`);
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function filterCards(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards(cat);
}

renderCards('all');
